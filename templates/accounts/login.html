{% extends 'base/_base.html' %}

{% block body_class %}
  bg-materials
{% endblock %}

{% load crispy_forms_tags %}

{% block title %}Логін{% endblock title %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4 bg-dark text-light border-0 rounded-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <i class="bi bi-box-arrow-in-right" style="font-size: 3rem; color: #ff6a00;"></i>
            <h2 class="mt-2 text-orange">Вхід</h2>
            <p class="text-muted">Увійди, щоб продовжити</p>
        </div>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-orange w-100 mt-3">Увійти</button>
        </form>
        <div class="mt-3 text-center">
            <small>Ще немає акаунта?
                <a href="{% url 'accounts:register' %}" class="text-orange">Зареєструватися</a>
            </small>
        </div>
    </div>
</div>
{% endblock content %}
