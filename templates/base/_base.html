<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BLOG++{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    /* Анімований фон */
    body {
      background: linear-gradient(-45deg, #0d0d0d, #3b2207, #000000, #8b3800);
      background-size: 400% 400%;
      animation: gradientFlow 14s ease infinite;
      color: #f5f5f5;
      font-family: "Segoe UI", sans-serif;
      min-height: 100vh;
      padding-top: 70px;
      padding-bottom: 60px;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Navbar */
    .navbar {
      background-color: rgba(0, 0, 0, 0.9);
      border-bottom: 2px solid #ff6a00;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .navbar-brand {
      color: #ff6a00 !important;
      font-weight: bold;
      font-size: 1.5rem;
      text-decoration: none;
      transition: 0.4s;
      position: relative;
      display: inline-flex;
      align-items: center;
      line-height: 1;
      height: 1.6rem; /* фіксована висота для вирівнювання */
    }

    /* Pornhub-версія (прихована за замовчуванням) */
    .logo-alt {
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%) scale(0.96);
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.3s ease;
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .logo-white {
      color: #fff;
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1;
    }

    .logo-orange {
      background-color: #ff9900;
      color: #000;
      padding: 3px 8px;
      border-radius: 4px;
      margin-left: 4px;
      font-weight: 700;
      font-size: 1.5rem;
      line-height: 1;
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transition: box-shadow 0.3s ease;
    }

    /* Ефект при наведенні */
    .navbar-brand:hover {
      color: transparent !important;
    }

    .navbar-brand:hover .logo-alt {
      opacity: 1;
      transform: translateY(-50%) scale(1);
    }

    .navbar-brand:hover .logo-orange {
      box-shadow: 0 0 10px rgba(255,153,0,0.5);
    }

    .nav-link {
      color: #f5f5f5 !important;
      transition: 0.3s;
    }

    .nav-link:hover {
      color: #ff6a00 !important;
    }

    /* Кнопки */
    .btn-orange {
      background: linear-gradient(90deg, #ff6a00, #ff8533);
      color: #fff;
      border: none;
      transition: 0.3s;
    }
    .btn-orange:hover {
      background: linear-gradient(90deg, #ff8533, #ff9e5c);
      transform: scale(1.05);
    }

    /* Footer */
    .footer {
      background-color: rgba(0, 0, 0, 0.9);
      color: #ff6a00;
      padding: 10px;
      text-align: center;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      border-top: 2px solid #ff6a00;
      z-index: 1000;
    }

    /* Контент */
    .container {
      max-width: 900px;
    }
  </style>
</head>

<body class="{% block body_class %}{% endblock %}">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">
        BLOG++
        <span class="logo-alt">
          <span class="logo-white">Blog</span><span class="logo-orange">++</span>
        </span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          {% if user.is_authenticated %}
            <a class="nav-link" href="{% url 'accounts:profile' %}">{{ user.username }}</a>
            <a class="nav-link" href="{% url 'accounts:logout' %}">Вийти</a>
          {% else %}
            <a class="nav-link" href="{% url 'accounts:login' %}">Увійти</a>
            <a class="nav-link" href="{% url 'accounts:register' %}">Зареєструватися</a>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <!-- Контент -->
  <div class="container mt-4">
    {% block content %}
      <h1 class="text-orange">Ласкаво просимо!</h1>
      <p>Це базова сторінка, яку можна розширювати.</p>
      <button class="btn btn-orange">Дізнатися більше</button>
    {% endblock %}
  </div>

  <!-- Footer -->
  <div class="footer">
    © 2025 Blog++ team
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
