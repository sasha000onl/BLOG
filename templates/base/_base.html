<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}BLOG++{% endblock %}</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* Фон з плавною анімацією */
        body {
            background: linear-gradient(-45deg, #0d0d0d, #3b2207, #000000, #8b3800);
            background-size: 400% 400%;
            animation: gradientFlow 14s ease infinite;
            color: #f5f5f5;
            font-family: "Segoe UI", sans-serif;
            min-height: 100vh;
        }
        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Навбар */
        .navbar {
            background-color: rgba(0, 0, 0, 0.85);
            border-bottom: 2px solid #ff6a00;
        }
        .navbar-brand {
            color: #ff6a00 !important;
            font-weight: bold;
        }
        .nav-link {
            color: #f5f5f5 !important;
            transition: 0.3s;
        }
        .nav-link:hover {
            color: #ff6a00 !important;
        }

        /* Текст */
        .text-orange {
            color: #ff6a00;
        }

        /* Контентні блоки */
        .bg-navy {
            background-color: #1a1a1a;
            color: #ffffff;
            border-left: 4px solid #ff6a00;
        }
        .bg-materials {
            background-color: #262626;
            color: #ffffff;
            border-left: 4px solid #ff8c42;
        }

        /* Кнопки */
        .btn-orange {
            background: linear-gradient(90deg, #ff6a00, #ff8533);
            color: #fff;
            border: none;
            transition: 0.3s;
        }
        .btn-orange:hover {
            background: linear-gradient(90deg, #ff8533, #ff9e5c);
            transform: scale(1.05);
        }

        /* Footer */
        .footer {
            background-color: rgba(0, 0, 0, 0.9);
            color: #ff6a00;
            padding: 15px;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
            border-top: 2px solid #ff6a00;
        }
    </style>
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Навбар -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="http://127.0.0.1:8000">BLOG++</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <a class="nav-link" href="{% url 'accounts:profile' %}">{{ user.username }}</a>
                        <a class="nav-link" href="{% url 'accounts:logout' %}">Вийти</a>
                    {% else %}
                        <a class="nav-link" href="{% url 'accounts:login' %}">Увійти</a>
                        <a class="nav-link" href="{% url 'accounts:register' %}">Зареєструватися</a>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <!-- Контент -->
    <div class="container mt-4">
        {% block content %}
        <h1 class="text-orange">Ласкаво просимо!</h1>
        <p>Це базова сторінка, яку можна розширювати.</p>
        <button class="btn btn-orange">Дізнатися більше</button>
        {% endblock %}
    </div>

    <!-- Footer -->
    <div class="footer">
        © 2025 Blog++ team
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
