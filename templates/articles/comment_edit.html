{% extends 'base/_base.html' %}

{% block title %}Редагувати коментар — BLOG++{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width:600px;">
    <div class="p-4 rounded shadow" 
         style="background:#1e1e1e; border-left:4px solid #ff6a00;">
         
        <h2 class="text-orange mb-3">✏️ Редагування коментаря</h2>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_content" class="form-label">Текст коментаря:</label>
                {{ form.content }}
            </div>
            
            <div class="d-flex justify-content-between mt-4">
                <button type="submit" 
                        class="btn btn-orange px-4 py-2"
                        style="border-radius:10px;">
                    💾 Зберегти
                </button>
                <a href="{% url 'articles:article_detail' comment.article.slug %}" 
                   class="btn btn-secondary px-4 py-2" 
                   style="border-radius:10px;">
                    ❌ Скасувати
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    /* Підтримка темного стилю Bootstrap форми */
    textarea, input[type="text"], input[type="email"] {
        background-color: #2a2a2a !important;
        color: #f5f5f5 !important;
        border: 1px solid #444 !important;
        border-radius: 6px;
        width: 100%;
        padding: 10px;
        resize: vertical;
    }
    textarea:focus, input:focus {
        border-color: #ff6a00 !important;
        outline: none;
        box-shadow: 0 0 5px #ff6a00;
    }
</style>
{% endblock %}
